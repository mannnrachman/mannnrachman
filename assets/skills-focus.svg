<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-label="Muhammad Rachman skill focus allocation: Linux and infrastructure 40 percent, AI and developer tooling 30 percent, backend and web 20 percent, education and productivity 10 percent">
  <defs>
    <linearGradient id="linux" x1="0" x2="1"><stop stop-color="#58a6ff"/><stop offset="1" stop-color="#2f81f7"/></linearGradient>
    <linearGradient id="ai" x1="0" x2="1"><stop stop-color="#bc8cff"/><stop offset="1" stop-color="#8957e5"/></linearGradient>
    <linearGradient id="backend" x1="0" x2="1"><stop stop-color="#3fb950"/><stop offset="1" stop-color="#238636"/></linearGradient>
    <linearGradient id="education" x1="0" x2="1"><stop stop-color="#f2cc60"/><stop offset="1" stop-color="#d29922"/></linearGradient>
    <style>
      .label { fill: #f0f6fc; font: 600 18px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
      .meta { fill: #8b949e; font: 14px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
      .percent { fill: #f0f6fc; font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .track { fill: #21262d; }
      .fill { transform-box: fill-box; transform-origin: left center; animation: load 1.4s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>
  <rect width="860" height="430" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text x="34" y="42" class="label" font-size="22">skill focus allocation</text>
  <text x="34" y="67" class="meta">100% of current work · Linux-first</text>
  <rect x="34" y="88" width="792" height="12" rx="6" fill="#21262d"/>
  <rect x="34" y="88" width="317" height="12" rx="6" fill="url(#linux)"/>
  <rect x="351" y="88" width="238" height="12" fill="url(#ai)"/>
  <rect x="589" y="88" width="158" height="12" fill="url(#backend)"/>
  <rect x="747" y="88" width="79" height="12" rx="6" fill="url(#education)"/>
  <g>
    <text x="34" y="143" class="label">Linux &amp; Infrastructure</text><text x="826" y="143" text-anchor="end" class="percent">40%</text>
    <rect x="34" y="157" width="792" height="16" rx="8" class="track"/><rect x="34" y="157" width="317" height="16" rx="8" fill="url(#linux)" class="fill"/>
    <text x="34" y="195" class="meta">Ubuntu · Bash · Nginx · Docker · systemd · SSH · VPS</text>
  </g>
  <g>
    <text x="34" y="239" class="label">AI &amp; Developer Tooling</text><text x="826" y="239" text-anchor="end" class="percent">30%</text>
    <rect x="34" y="253" width="792" height="16" rx="8" class="track"/><rect x="34" y="253" width="238" height="16" rx="8" fill="url(#ai)" class="fill"/>
    <text x="34" y="291" class="meta">Coding agents · MCP · LLM integrations · RAG · automation</text>
  </g>
  <g>
    <text x="34" y="335" class="label">Backend &amp; Web</text><text x="826" y="335" text-anchor="end" class="percent">20%</text>
    <rect x="34" y="349" width="792" height="16" rx="8" class="track"/><rect x="34" y="349" width="158" height="16" rx="8" fill="url(#backend)" class="fill"/>
    <text x="34" y="387" class="meta">Go · Python · Rust · TypeScript · React · PostgreSQL · SQLite</text>
  </g>
  <text x="826" y="421" text-anchor="end" class="meta">Education &amp; Productivity · 10%</text>
</svg>
