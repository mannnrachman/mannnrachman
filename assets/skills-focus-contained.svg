<svg xmlns="http://www.w3.org/2000/svg" width="860" height="510" viewBox="0 0 860 510" role="img" aria-label="Animated skill focus allocation totaling 100 percent: Linux and infrastructure 40 percent, AI and developer tooling 30 percent, backend and web 20 percent, education and productivity 10 percent">
  <defs>
    <linearGradient id="linux" x1="0" x2="1"><stop stop-color="#58a6ff"/><stop offset="1" stop-color="#2f81f7"/></linearGradient>
    <linearGradient id="ai" x1="0" x2="1"><stop stop-color="#bc8cff"/><stop offset="1" stop-color="#8957e5"/></linearGradient>
    <linearGradient id="backend" x1="0" x2="1"><stop stop-color="#3fb950"/><stop offset="1" stop-color="#238636"/></linearGradient>
    <linearGradient id="education" x1="0" x2="1"><stop stop-color="#f2cc60"/><stop offset="1" stop-color="#d29922"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="clip-linux"><rect x="34" y="157" width="317" height="16" rx="8"/></clipPath>
    <clipPath id="clip-ai"><rect x="34" y="253" width="238" height="16" rx="8"/></clipPath>
    <clipPath id="clip-backend"><rect x="34" y="349" width="158" height="16" rx="8"/></clipPath>
    <clipPath id="clip-education"><rect x="34" y="445" width="79" height="16" rx="8"/></clipPath>
    <style>
      .label { fill: #f0f6fc; font: 600 18px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
      .meta { fill: #8b949e; font: 14px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
      .percent { fill: #f0f6fc; font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .track { fill: #21262d; }
      .fill { animation: pulse 1.8s ease-in-out infinite; }
      .shine { opacity: 0; }
      .shine-linux { animation: sweep-linux 3.2s ease-in-out infinite; }
      .shine-ai { animation: sweep-ai 3.2s .35s ease-in-out infinite; }
      .shine-backend { animation: sweep-backend 3.2s .7s ease-in-out infinite; }
      .shine-education { animation: sweep-education 3.2s 1.05s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
      @keyframes sweep-linux { 0%, 15% { transform: translateX(-90px); opacity: 0; } 35% { opacity: 1; } 65%, 100% { transform: translateX(317px); opacity: 0; } }
      @keyframes sweep-ai { 0%, 15% { transform: translateX(-90px); opacity: 0; } 35% { opacity: 1; } 65%, 100% { transform: translateX(238px); opacity: 0; } }
      @keyframes sweep-backend { 0%, 15% { transform: translateX(-90px); opacity: 0; } 35% { opacity: 1; } 65%, 100% { transform: translateX(158px); opacity: 0; } }
      @keyframes sweep-education { 0%, 15% { transform: translateX(-40px); opacity: 0; } 35% { opacity: 1; } 65%, 100% { transform: translateX(79px); opacity: 0; } }
    </style>
  </defs>
  <rect width="860" height="510" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text x="34" y="42" class="label" font-size="22">skill focus allocation</text>
  <text x="34" y="67" class="meta">100% of current work · Linux-first · contained live bars</text>
  <rect x="34" y="88" width="792" height="14" rx="7" fill="#21262d"/>
  <rect x="34" y="88" width="317" height="14" rx="7" fill="url(#linux)"/>
  <rect x="351" y="88" width="238" height="14" fill="url(#ai)"/>
  <rect x="589" y="88" width="158" height="14" fill="url(#backend)"/>
  <rect x="747" y="88" width="79" height="14" rx="7" fill="url(#education)"/>
  <g>
    <text x="34" y="143" class="label">Linux &amp; Infrastructure</text><text x="826" y="143" text-anchor="end" class="percent">40%</text>
    <rect x="34" y="157" width="792" height="16" rx="8" class="track"/><rect x="34" y="157" width="317" height="16" rx="8" fill="url(#linux)" class="fill"/><rect x="34" y="157" width="90" height="16" fill="url(#shine)" clip-path="url(#clip-linux)" class="shine shine-linux"/>
    <text x="34" y="195" class="meta">Ubuntu · Bash · Nginx · Docker · systemd · SSH · VPS</text>
  </g>
  <g>
    <text x="34" y="239" class="label">AI &amp; Developer Tooling</text><text x="826" y="239" text-anchor="end" class="percent">30%</text>
    <rect x="34" y="253" width="792" height="16" rx="8" class="track"/><rect x="34" y="253" width="238" height="16" rx="8" fill="url(#ai)" class="fill"/><rect x="34" y="253" width="90" height="16" fill="url(#shine)" clip-path="url(#clip-ai)" class="shine shine-ai"/>
    <text x="34" y="291" class="meta">Coding agents · MCP · LLM integrations · RAG · automation</text>
  </g>
  <g>
    <text x="34" y="335" class="label">Backend &amp; Web</text><text x="826" y="335" text-anchor="end" class="percent">20%</text>
    <rect x="34" y="349" width="792" height="16" rx="8" class="track"/><rect x="34" y="349" width="158" height="16" rx="8" fill="url(#backend)" class="fill"/><rect x="34" y="349" width="70" height="16" fill="url(#shine)" clip-path="url(#clip-backend)" class="shine shine-backend"/>
    <text x="34" y="387" class="meta">Go · Python · Rust · TypeScript · React · PostgreSQL · SQLite</text>
  </g>
  <g>
    <text x="34" y="431" class="label">Education &amp; Productivity</text><text x="826" y="431" text-anchor="end" class="percent">10%</text>
    <rect x="34" y="445" width="792" height="16" rx="8" class="track"/><rect x="34" y="445" width="79" height="16" rx="8" fill="url(#education)" class="fill"/><rect x="34" y="445" width="40" height="16" fill="url(#shine)" clip-path="url(#clip-education)" class="shine shine-education"/>
    <text x="34" y="483" class="meta">Education technology · academic systems · personal productivity</text>
  </g>
</svg>
